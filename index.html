<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PT Putra Timur Jaya | Monitoring Teknisi</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icon -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="wrapper">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-circle">

                <i class="bi bi-broadcast"></i>

            </div>

            <div>

                <h5>PT PUTRA TIMUR JAYA</h5>

                <small>Monitoring Teknisi</small>

            </div>

        </div>

        <hr>

        <div class="menu-title">

            DASHBOARD

        </div>

        <div class="card-status">

            <span>Total WO</span>

            <h2 id="totalWO">0</h2>

        </div>

        <div class="card-status green">

            <span>Completed</span>

            <h2 id="completed">0</h2>

        </div>

        <div class="card-status blue">

            <span>Config</span>

            <h2 id="config">0</h2>

        </div>

        <div class="card-status yellow">

            <span>OGP</span>

            <h2 id="ogp">0</h2>

        </div>

        <div class="card-status red">

            <span>Kendala</span>

            <h2 id="kendala">0</h2>

        </div>

        <div class="card-status dark">

            <span>Teknisi Aktif</span>

            <h2 id="teknisiAktif">0</h2>

        </div>

    </aside>

    <!-- CONTENT -->

    <main class="content">

        <!-- HEADER -->

        <header class="topbar">

            <div>

                <h3>Monitoring Teknisi Lapangan</h3>

                <small id="tanggalHariIni">
                    Loading...
                </small>

            </div>

            <div>

                <button class="btn btn-success" id="btnRefresh">

                    <i class="bi bi-arrow-clockwise"></i>

                    Refresh

                </button>

            </div>

        </header>

        <!-- FILTER -->

        <section class="filter-area">

            <div class="row g-2">

                <div class="col-lg-3">

                    <input
                        type="date"
                        class="form-control"
                        id="filterTanggal">

                </div>

                <div class="col-lg-3">

                    <select
                        class="form-select"
                        id="filterTeknisi">

                        <option value="">Semua Teknisi</option>

                    </select>

                </div>

                <div class="col-lg-2">

                    <select
                        class="form-select"
                        id="filterStatus">

                        <option value="">Semua Status</option>

                    </select>

                </div>

                <div class="col-lg-4">

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Cari WO / SC / ODP..."
                        id="search">

                </div>

            </div>

        </section>

        <!-- MAP -->

        <section class="map-container">

            <div id="map"></div>

        </section>

        <!-- DETAIL -->

        <section class="detail">

            <h5>

                Detail Order

            </h5>

            <div id="detailWO">

                Klik marker pada peta.

            </div>

        </section>

    </main>

</div>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Javascript -->

<script src="js/app.js"></script>
<script src="js/api.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>

</body>

</html>
