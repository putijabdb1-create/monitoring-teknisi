<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PT Putra Timur Jaya | Monitoring Teknisi</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="app">

    <!-- ================= HEADER ================= -->

    <header class="topbar">

        <div class="logo-area">

            <div class="logo-circle">

                <i class="bi bi-broadcast"></i>

            </div>

            <div>

                <h3>PT PUTRA TIMUR JAYA</h3>

                <small>Monitoring Teknisi V3</small>

            </div>

        </div>

        <div class="live">

            <span class="badge bg-success">

                LIVE

            </span>

            <span id="jam">

                --

            </span>

        </div>

    </header>


    <!-- ================= CARD ================= -->

    <section class="dashboard-card">

        <div class="card-item">

            <small>Total WO</small>

            <h3 id="totalWO">0</h3>

        </div>

        <div class="card-item">

            <small>Completed</small>

            <h3 id="completed">0</h3>

        </div>

        <div class="card-item">

            <small>Config</small>

            <h3 id="config">0</h3>

        </div>

        <div class="card-item">

            <small>OGP</small>

            <h3 id="ogp">0</h3>

        </div>

        <div class="card-item">

            <small>Kendala</small>

            <h3 id="kendala">0</h3>

        </div>

        <div class="card-item">

            <small>Teknisi</small>

            <h3 id="teknisiAktif">0</h3>

        </div>

    </section>


<!-- ================= FILTER ================= -->

<section class="filter">

    <!-- Tanggal -->
    <input
        id="filterTanggal"
        class="form-control"
        type="date">

    <!-- Multi Teknisi -->
    <div class="multi-select" id="teknisiBox">

        <button type="button" class="multi-btn" id="btnTeknisi">
            👷 Semua Teknisi
            <i class="bi bi-chevron-down"></i>
        </button>

        <div class="multi-dropdown" id="dropdownTeknisi">

            <input
                type="text"
                id="searchTeknisi"
                class="form-control"
                placeholder="Cari Teknisi...">

            <div class="multi-action">

                <button
                    type="button"
                    id="checkAllTeknisi"
                    class="btn btn-sm btn-primary">
                    Semua
                </button>

                <button
                    type="button"
                    id="clearTeknisi"
                    class="btn btn-sm btn-outline-secondary">
                    Clear
                </button>

            </div>

            <div id="listTeknisi" class="multi-list"></div>

        </div>

    </div>

    <!-- Multi Work Zone -->
    <div class="multi-select" id="zoneBox">

        <button type="button" class="multi-btn" id="btnZone">
            📍 Semua Work Zone
            <i class="bi bi-chevron-down"></i>
        </button>

        <div class="multi-dropdown" id="dropdownZone">

            <input
                type="text"
                id="searchZone"
                class="form-control"
                placeholder="Cari Work Zone...">

            <div class="multi-action">

                <button
                    type="button"
                    id="checkAllZone"
                    class="btn btn-sm btn-primary">
                    Semua
                </button>

                <button
                    type="button"
                    id="clearZone"
                    class="btn btn-sm btn-outline-secondary">
                    Clear
                </button>

            </div>

            <div id="listZone" class="multi-list"></div>

        </div>

    </div>

    <!-- Search -->
    <input
        id="searchWO"
        class="form-control"
        placeholder="Cari WO / SC / ODP">

    <!-- Refresh -->
    <button
        id="btnRefresh"
        class="btn btn-primary">

        <i class="bi bi-arrow-clockwise"></i>

        Refresh

    </button>

</section>

<!-- Filter Aktif -->

<div id="activeFilter" class="active-filter"></div>

    <!-- ================= 3 PANEL ================= -->

    <section class="workspace">


        <!-- PANEL WO -->

        <aside class="left-panel">

            <div class="panel-title">

                <i class="bi bi-list-check"></i>

                Daftar WO

            </div>

            <div id="woList">

                Loading...

            </div>

        </aside>


        <!-- PANEL MAP -->

        <main class="center-panel">

            <div class="panel-title">

                <i class="bi bi-geo-alt-fill"></i>

                Monitoring Map

            </div>

            <div id="map"></div>

        </main>


        <!-- PANEL DETAIL -->

        <aside class="right-panel">

            <div class="panel-title">

                <i class="bi bi-card-list"></i>

                Detail WO

            </div>

            <div id="detailWO">

                Pilih marker atau WO.

            </div>

        </aside>

    </section>

</div>


<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Javascript -->

<script src="js/app.js"></script>

<script src="js/api.js"></script>

<script src="js/map.js"></script>

<script src="js/ui.js"></script>

</body>

</html>
